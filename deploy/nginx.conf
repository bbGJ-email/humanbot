server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name humanbot.hk.xingk.xyz;

    # ACME HTTP-01 验证（证书续期用，必须早于反代 location）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/humanbot/acme;
        try_files $uri =404;
    }

    # HTTP 自动跳 HTTPS
    set $isRedcert 1;
    if ($server_port != 443) { set $isRedcert 2; }
    if ( $uri ~ /\.well-known/ ) { set $isRedcert 1; }
    if ($isRedcert != 1) { rewrite ^(/.*)$ https://$host$1 permanent; }

    ssl_certificate     /etc/letsencrypt/live/humanbot.hk.xingk.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanbot.hk.xingk.xyz/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;

        # WebSocket（控制台 /ws/console 事件流必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 事件流是长连接，别被默认 60s 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
