# systemd 捕获的 stdout/stderr 不受 Python 日志轮转影响，这里单独轮转。
# 项目自己的 logs/humanbot.log 由 RotatingFileHandler 管（5MB × 3），不在此列。
/www/wwwroot/humanbot/logs/service.log
/www/wwwroot/humanbot/logs/service.err.log
{
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
